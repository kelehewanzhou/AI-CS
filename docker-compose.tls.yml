# Use with: docker compose -f docker-compose.yml -f docker-compose.tls.yml ...
services:
  nginx:
    environment:
      NGINX_TLS: "1"
    ports:
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${REDIRECT_PORT:-80}:80"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
