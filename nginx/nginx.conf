user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    # Paths only: no query strings, Cookie, authorization or request bodies.
    log_format safe escape=json '{"request_id":"$request_id","ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"seconds":$request_time}';
    access_log /dev/stdout safe;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    map $http_content_type $is_json { default 0; "~*^application/json(?:\\s*;.*)?$" 1; }
    map "$request_method:$origin_allowed" $bad_origin { default 0; "POST:0" 1; }
    map "$request_method:$is_json" $bad_json { default 0; "POST:0" 1; }
    include /etc/nginx/conf.d/*.conf;
}
