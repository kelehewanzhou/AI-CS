include /etc/nginx/snippets/headers.conf;
root /usr/share/nginx/html;
client_max_body_size 64k;
resolver 127.0.0.11 valid=10s ipv6=off;
# Runtime DNS resolution follows the recreated backend container during updates.
set $backend_target backend:8000;

error_page 502 503 504 =503 @unavailable;
error_page 429 =429 @rate_limited;
error_page 403 =403 @forbidden;
error_page 413 422 =422 @invalid;

location = /nginx-live { access_log off; return 200 'ok'; }
location = /api/v1/auth/login {
    include /etc/nginx/snippets/api.conf;
    limit_req zone=login_limit burst=5 nodelay;
    limit_req_status 429;
    rewrite ^ /auth/login break;
    proxy_pass http://$backend_target;
}
location /api/v1/ {
    include /etc/nginx/snippets/api.conf;
    rewrite ^/api/v1/(.*)$ /$1 break;
    proxy_pass http://$backend_target;
}
location /health/ {
    if (-f /var/run/kglearn/maintenance) { return 503; }
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://$backend_target;
}
location / {
    if (-f /var/run/kglearn/maintenance) { return 503; }
    try_files $uri $uri/index.html =404;
}
location @unavailable {
    default_type application/json;
    return 503 '{"code":"UNAVAILABLE","message":"服务暂时不可用","request_id":"$request_id"}';
}
location @rate_limited {
    include /etc/nginx/snippets/headers.conf;
    add_header Retry-After 12 always;
    default_type application/json;
    return 429 '{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试","request_id":"$request_id"}';
}
location @forbidden {
    default_type application/json;
    return 403 '{"code":"FORBIDDEN","message":"不允许的Origin","request_id":"$request_id"}';
}
location @invalid {
    default_type application/json;
    return 422 '{"code":"VALIDATION_ERROR","message":"请求须为大小不超过64KB的JSON","request_id":"$request_id"}';
}
